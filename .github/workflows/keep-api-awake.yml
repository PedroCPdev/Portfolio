# Mantém a API do Render acordada durante a janela de maior tráfego.
#
# POR QUE NÃO 24/7:
#   O free tier do Render dá 750 instance-hours por mês, por workspace, e um serviço
#   dormindo não consome hora nenhuma. Um mês de 31 dias tem 744 horas — pingar 24/7
#   deixaria só 6h de margem, e estourar a cota faz o Render SUSPENDER todos os serviços
#   free até o mês seguinte. Isso trocaria uma falha intermitente por uma falha total.
#
#   A janela abaixo cobre 16h/dia (~496 h/mês), com folga confortável.
#   Fora dela o serviço dorme e o frontend absorve o cold start com retry
#   (ver frontend/src/lib/api.ts).
#
# ÚNICO PONTO DE EDIÇÃO DA JANELA: a linha `- cron:` logo abaixo.
#   Horas em UTC. O padrão 0-2,11-23 equivale a 08:00–00:00 no horário de Brasília (UTC-3).
#   Ampliar a janela aumenta o consumo: cada hora/dia a mais soma ~31 h/mês.

name: keep-api-awake

on:
  schedule:
    - cron: "*/10 0-2,11-23 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Acordar a API
        env:
          # Defina em Settings > Secrets and variables > Actions > Variables
          # Ex.: https://portfolio-api-xxxx.onrender.com
          API_BASE_URL: ${{ vars.RENDER_API_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::error::A variável RENDER_API_URL não está definida no repositório."
            exit 1
          fi

          # --max-time 90 porque o cold start do Render leva ~1 min.
          # O /health não toca no Firestore, então o ping não gasta cota de leitura do banco.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 "$API_BASE_URL/health" || echo "000")

          echo "GET $API_BASE_URL/health -> $code"
          if [ "$code" != "200" ]; then
            echo "::warning::Ping não retornou 200 (recebido: $code)."
          fi

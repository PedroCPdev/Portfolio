# Ping manual em /health, para acordar a API do Render na hora.
#
# O ping agendado mora no cron-job.org desde 2026-10-19 (AD-016): a cada 10 min, das 08:00 às
# 23:50 em America/Sao_Paulo. O `schedule:` saiu daqui porque o GitHub rodava de 3 a 7 das 96
# execuções diárias e desliga workflows agendados após 60 dias sem atividade no repositório.
# A janela de 16h/dia continua valendo pelo motivo do AD-005: 750 instance-hours/mês no free tier.

name: keep-api-awake

on:
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Acordar a API
        env:
          # Defina em Settings > Secrets and variables > Actions > Variables
          # Ex.: https://portfolio-api-xxxx.onrender.com
          API_BASE_URL: ${{ vars.RENDER_API_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::error::A variável RENDER_API_URL não está definida no repositório."
            exit 1
          fi

          # --max-time 90 porque o cold start do Render leva ~1 min.
          # O /health não toca no Firestore, então o ping não gasta cota de leitura do banco.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 "$API_BASE_URL/health" || echo "000")

          echo "GET $API_BASE_URL/health -> $code"
          if [ "$code" != "200" ]; then
            echo "::warning::Ping não retornou 200 (recebido: $code)."
          fi

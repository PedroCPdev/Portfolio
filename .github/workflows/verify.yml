# Roda o mesmo gate que o agente e os hooks usam. Se passa aqui, passou de verdade.
name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # A API mira net10.0; o emulador do Firestore (firebase-tools) exige JDK 21+.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
        working-directory: frontend

      - name: verify build
        run: node scripts/verify.mjs build --log verify-build.txt

      - name: Guardar log do verify
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-build-log
          path: verify-build.txt

# Abre PR quando uma dependência ganha versão nova ou aviso de segurança (C-11).
# Atualizações de versão saem uma vez por semana, agrupadas por ecossistema para não virar fila
# de PR. Avisos de segurança abrem PR na hora, independente do agendamento.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    # O TypeScript 7 (compilador em Go) ainda não é suportado pelo typescript-eslint: o lint
    # quebra com "typescript-eslint does not support TS 7.0" (PR #6, 2026-10-19).
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      frontend:
        patterns: ["*"]

  - package-ecosystem: nuget
    directories: ["/PortfolioApi", "/PortfolioApi.Tests"]
    schedule:
      interval: weekly
    groups:
      dotnet:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /PortfolioApi
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
